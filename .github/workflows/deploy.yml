name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual deploys

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm next build
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      # Amplify Hosting handles both:
      #   - Static assets via S3 + CloudFront (your frontend)
      #   - API routes via Lambda (your Stripe backend)
      # Amplify auto-detects Next.js and configures both layers.
      - name: Deploy to Amplify Hosting
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name main \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "Started Amplify job: $JOB_ID"
          echo "job-id=$JOB_ID" >> $GITHUB_OUTPUT
          # Wait for completion (poll every 30s, timeout 20min)
          for i in $(seq 1 40); do
            STATUS=$(aws amplify get-job \
              --app-id ${{ secrets.AMPLIFY_APP_ID }} \
              --branch-name main \
              --job-id $JOB_ID \
              --query 'job.summary.status' \
              --output text)
            echo "[$i/40] Amplify job status: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then echo "Deploy succeeded"; exit 0; fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then echo "Deploy $STATUS"; exit 1; fi
            sleep 30
          done
          echo "Timed out waiting for deploy"; exit 1

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend (static pages) → S3 + CloudFront" >> $GITHUB_STEP_SUMMARY
          echo "- Backend (API routes) → Amplify / Lambda" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** [https://cloudless.gr](https://cloudless.gr)" >> $GITHUB_STEP_SUMMARY